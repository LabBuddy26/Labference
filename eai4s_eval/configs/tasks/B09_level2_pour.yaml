task_id: level2_pour
task_name: Level 2 Pour Proxy
suite: eai4s_benchmark_full_v1
runtime: {backend: eai4s_benchmark, env_config: level2_pour, policy_phase: after_scripted_pick, proxy_task: true}
robot: franka
task_family: pouring
task_level: level2
task_tags: [benchmark, pouring, proxy, truth_pending]
leaderboard_group: benchmark_pouring
control_hz: 10
physics_hz: 60
predicate_hz: 60
max_steps: 3000
instruction: {canonical: Pick up the tube from the table and pour it into the target}
success:
  logic: robust_semantic_v0
  hold_time_sec: 1.0
  goal: {all: [{predicate: near, args: {a_key: object_pos, b_key: target_pos, axes: xy, distance_threshold_m: 0.15}}, {predicate: task_state_true, args: {key: task_state.pour_returned}}]}
  sequence: {required: true, events: [near_target, tilt_source, return_upright]}
  terminal: {required: false, all: []}
  stability: {required: false, all: []}
  safety: {hard_fail: []}
metrics: [volume_retained_diagnostic]
failure_modes: [{code: liquid_truth_unavailable, category: sequence_error, description: Liquid volume truth is diagnostic only.}]
