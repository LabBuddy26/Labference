task_id: level4_L11_ConditionModule
task_name: Level 4 Condition Module
task_version: 1.0.0
suite: eai4s_benchmark_full_v1
runtime: {backend: eai4s_benchmark, env_config: level4_L11_ConditionModule, policy_phase: full_task}
robot: franka
task_family: condition_module
task_level: level4
task_tags: [benchmark, multi_stage, pick_place, button]
leaderboard_group: benchmark_multi_stage
control_hz: 10
physics_hz: 60
predicate_hz: 60
max_steps: 700
instruction:
  canonical: Place the beaker onto the heat device, press the device button, then return the beaker to its original spot
success:
  logic: robust_semantic_v0
  hold_time_sec: 0.5
  goal:
    all:
      - predicate: task_state_true
        args: {id: beaker_on_device, key: task_state.beaker_on_device}
      - predicate: button_pressed
      - predicate: task_state_true
        args: {id: beaker_returned, key: task_state.beaker_returned}
  terminal:
    required: true
    all:
      - predicate: released
        args: {open_threshold: 0.035}
  stability: {required: false, all: []}
  safety: {hard_fail: []}
failure_modes:
  - {code: beaker_not_on_device, category: wrong_place, description: The beaker did not reach the heat-device top.}
  - {code: button_not_pressed, category: sequence_error, description: The device button was not pressed.}
  - {code: beaker_not_returned, category: sequence_error, description: The beaker was not returned to its initial spot.}
  - {code: timeout, category: timeout, description: Episode exceeded max_steps.}
required_snapshot_fields:
  - task_state.beaker_on_device
  - task_state.button_pressed
  - task_state.beaker_returned
  - task_state.condition_module_complete
  - gripper_pos
