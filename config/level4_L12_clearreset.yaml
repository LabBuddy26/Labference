name: Level4_L12_clearreset
task_type: "clearreset"
controller_type: "clear_reset"
mode: "collect"

evaluation:
  policy:
    provider: "gr00t"
    profile: "eai4s_eval/configs/policies/gr00t_franka_ee_pos_v1.yaml"
    host: "127.0.0.1"
    port: 5555
    protocol: "zmq"
    timeout: 30
    execution_horizon: null
    control_hz: 10
  task_spec: "eai4s_eval/configs/tasks/B20_level4_clear_reset.yaml"
  model_name: "eai4s_gr00t"
  split: "sim_clean"
  num_episodes: 5
  max_steps: 700
  output_root: "outputs/eval_runs"
  save_video: true

collection_startup:
  ready_joint_positions: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854, 0.04, 0.04]
  warmup_steps: 120
  stable_frames: 30
  joint_velocity_threshold: 0.02
  object_displacement_threshold: 0.0005
  max_wait_steps: 600

sub_object: "/World/VialBottle"
sub_object1: "/World/tube"
target_path: "/World/SamplePlaceBox"
target_path1: "/World/tube_rack"
max_episodes: 200

clear_reset_success:
  pick_lift_height_m: 0.12
  place_xy_tolerance_m: 0.02
  place_z_tolerance_m: 0.05
  # Success means the tube bottom has passed through the upper guide plate.
  # It may rest on either internal support level; do not require the deepest
  # possible settled centre.
  tube_minimum_insertion_depth_m: 0.015
  # Exact first-hole axis extracted from test_tube_rack_3h_mesh.usd. Local Y
  # becomes world Z under the configured rack orientation. The upper plate is
  # the insertion aperture; the lower small opening supports the tube bottom.
  tube_socket_local_position: [-0.04224623, 0.280, -0.00624620]
  tube_bottom_seat_local_position: [-0.04224623, 0.145, -0.00624620]
  # Exact centre of the selected SamplePlaceBox hole, in asset-local metres.
  # Local Y spans the 20 mm plate thickness and becomes world Z after the
  # configured rack rotation. The settled centre lies at mid-thickness.
  vial_socket_local_position: [0.024, 0.020, 0.0]
  vial_settled_center_local_position: [0.024, 0.010, 0.0]

# Shared guarded insertion profile for both the vial/sample-box placement and
# the tube/rack placement. Object-to-hand offset is measured after each grasp.
guarded_insertion:
  # Long objects must lift at the source and translate above obstacles before
  # descending over the selected socket.
  lift_before_approach: true
  approach_height: 0.12
  alignment_height: 0.08
  insertion_step: 0.00025
  xy_alignment_tolerance: 0.003
  fine_alignment_z_tolerance: 0.008
  insertion_tracking_tolerance: 0.004
  # The learned Cartesian bias intentionally leaves several millimetres
  # between the biased RMP command and the actual hand. Physical coaxiality is
  # enforced by the stricter 2 mm object-centre gate below.
  insertion_lateral_tolerance: 0.005
  insertion_axial_tolerance: 0.007
  object_lateral_tolerance: 0.002
  object_axial_tolerance: 0.007
  fine_alignment_max_correction: 0.005
  fine_alignment_feedback_gain: 0.2
  grasp_tracking_tolerance: 0.015
  grasp_offset_update_limit: 0.002
  pre_release_hold_frames: 30
  post_release_settle_frames: 90
  retreat_height: 0.12
  phase_timeout_steps:
    lift_clearance: 480
    approach: 480
    fine_align: 480
    insert: 900
    hold_before_release: 300
    release: 60
    retreat: 480
    post_release_settle: 150

infer:
  action_space: "ee_pos"
  type: "local"
  obs_names: {"camera_1_rgb": "camera_1_rgb", "camera_3_rgb": "camera_3_rgb"}
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

scene:
  - prim_path: "/World/table"
    usd_path: "assets/chemistry_lab/assets/table.usd"
    position: [0.0, 0.0, 1.25]
    orientation: [1.0, 0.0, 0.0, 0.0]
    scale: [0.001, 0.001, 0.001]
  - prim_path: "/World/beaker2"
    usd_path: "assets/chemistry_lab/assets/beaker_2.usd"
    position: [0.6, 0.0, 0.72]
    orientation: [0.707, 0.707, 0.0, 0.0]
    scale: [1.0, 1.0, 1.0]
    glass: true
  - prim_path: "/World/conical"
    usd_path: "assets/chemistry_lab/assets/conical_bottle01.usd"
    position: [0.5, -0.2, 0.75]
    orientation: [0.707, 0.707, 0.0, 0.0]
    scale: [0.0001, 0.0001, 0.0001]
    glass: true
  - prim_path: "/World/flask"
    usd_path: "assets/chemistry_lab/assets/flask.usd"
    position: [0.45, 0.0, 0.75]
    orientation: [0.707, 0.707, 0.0, 0.0]
    scale: [0.1, 0.1, 0.1]
    glass: true
  - prim_path: "/World/vial"
    usd_path: "assets/chemistry_lab/assets/vial.usd"
    position: [0.4, -0.3, 0.75]
    orientation: [0.707, 0.707, 0.0, 0.0]
    scale: [0.1, 0.1, 0.1]
    glass: true
  - prim_path: "/World/VialBottle"
    usd_path: "assets/chemistry_lab/assets/VialBottle_01.usd"
    position: [0.23, 0.15, 0.76]
    orientation: [0.0, 1.0, 0.0, 0.0]
    scale: [0.45, 0.45, 0.45]
  - prim_path: "/World/tube"
    usd_path: "assets/chemistry_lab/assets/test_tube.usd"
    position: [0.18, 0.15, 0.71]
    orientation: [0.0, 1.0, 0.0, 0.0]
    scale: [0.75, 0.75, 0.75]
  - prim_path: "/World/SamplePlaceBox"
    usd_path: "assets/chemistry_lab/assets/SamplePlaceBox.usd"
    position: [0.2, 0.3, 0.70]
    orientation: [0.707, 0.707, 0.0, 0.0]
    scale: [2.0, 2.0, 2.0]
  - prim_path: "/World/tube_rack"
    usd_path: "assets/chemistry_lab/assets/test_tube_rack_3h_mesh.usd"
    position: [0.32, -0.1, 0.6]
    orientation: [0.5, 0.5, 0.5, 0.5]
    scale: [1.0, 1.0, 1.0]

task:
  # Two picks plus two guarded insertions exceed the legacy 2000-frame cap.
  # This remains only a collection safety limit; each insertion phase keeps
  # its own shorter, actionable timeout above.
  max_steps: 6000
  obj_paths:
    - path: "/World/VialBottle"
      position_range: {x: [0.15, 0.23], y: [-0.15, -0.10], z: [0.76, 0.76]}

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.0, 0.0, 1.2]
    resolution: [640, 480]
    focal_length: 10
    orientation: [0.57922, 0.40558, 0.40558, 0.57923]
    image_type: "rgb"
  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    local_translation: [-0.20, 0.0, -0.01]
    local_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    resolution: [640, 480]
    focal_length: 10.0
    horizontal_aperture: 20.955
    focus_distance: 0.50
    clipping_range: [0.05, 10.0]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, 0.0, 0.71]

collector: {type: "default", compression: gzip, sample_hz: 10}
hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
