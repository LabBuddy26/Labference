infer:
  action_space: "ee_pos"
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_3_rgb": 'camera_3_rgb'}

  policy_model_path: "outputs/train/2025.07.29/17.08.44_train_act_image_pick_act/checkpoints/latest.ckpt"
  policy_config_path: "outputs/train/2025.07.29/17.08.44_train_act_image_pick_act/.hydra/config.yaml"
  normalizer_path: "outputs/train/2025.07.29/17.08.44_train_act_image_pick_act/checkpoints/normalize.ckpt"

  host: "101.126.156.90"
  port: 10023
  n_obs_steps: 3
  timeout: 30
  max_retries: 3

  is_test_material: False

task:
  max_steps: 4000
  obj_paths:
    - path: "/World/beaker_03"
      position_range:
        x: [0.15, 0.2]
        y: [-0.3, -0.25]
        z: [0.72, 0.72]
    
    - path: "/World/beaker_04"
      position_range:
        x: [0.15, 0.2]
        y: [-0.2, -0.1]
        z: [0.72, 0.72]
    
    - path: "/World/beaker_05"
      position_range:
        x: [0.15, 0.2]
        y: [-0.05, 0.1]
        z: [0.72, 0.72]
    
cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.0, 0.0, 1.2]
    resolution: [640, 480]
    focal_length: 10
    orientation: [0.57922, 0.40558, 0.40558, 0.57923]
    image_type: "rgb"
  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    local_translation: [-0.20, 0.0, -0.01]
    local_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    resolution: [640, 480]
    focal_length: 10.0
    horizontal_aperture: 20.955
    focus_distance: 0.50
    clipping_range: [0.05, 10.0]
    image_type: "rgb"
robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip
  sample_hz: 10

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
