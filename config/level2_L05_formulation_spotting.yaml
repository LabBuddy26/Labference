name: Level2_L05_formulation_spotting

task_type: "formulaspotting"
controller_type: "formula_spotting"

mode: "collect"

evaluation:
  policy: {provider: gr00t, profile: eai4s_eval/configs/policies/gr00t_franka_ee_pos_v1.yaml, host: 127.0.0.1, port: 5555, protocol: zmq, timeout: 30, execution_horizon: null, control_hz: 10}
  task_spec: eai4s_eval/configs/tasks/B31_level2_L05_formulation_spotting.yaml
  model_name: eai4s_gr00t
  split: sim_clean
  num_episodes: 1
  max_steps: 1800
  output_root: outputs/eval_runs
  save_video: true

sub_object: "/World/VialBottle"
target_path: "/World/SamplePlaceBox"

max_episodes: 200

collection_startup: {drive_robot: true, ready_joint_positions: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854, 0.04, 0.04], warmup_steps: 120, stable_frames: 30, joint_velocity_threshold: 0.02, object_displacement_threshold: 0.0005, max_wait_steps: 600}
collection_control: {main_compatible: true, grasp_width_m: 0.001}

infer:
  action_space: "ee_pos"
  type: "local"
  obs_names: {"camera_1_rgb": "camera_1_rgb", "camera_3_rgb": "camera_3_rgb"}
    
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

scene:
    - prim_path: "/World/table"
      usd_path: "assets/chemistry_lab/assets/table.usd"
      position: [0.0, 0.0, 1.25]
      orientation: [1.0, 0.0, 0.0, 0.0]
      scale: [0.001, 0.001, 0.001]

  
    - prim_path: "/World/conical"
      usd_path: "assets/chemistry_lab/assets/conical_bottle01.usd"
      position: [0.5, -0.2, 0.75]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [0.0001, 0.0001, 0.0001]
      glass: True
    
    - prim_path: "/World/flask"
      usd_path: "assets/chemistry_lab/assets/flask.usd"
      position: [0.45, 0.0, 0.75]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [0.1, 0.1, 0.1]
      glass: True
    
    - prim_path: "/World/vial"
      usd_path: "assets/chemistry_lab/assets/vial.usd"
      position: [0.4, -0.3, 0.75]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [0.1, 0.1, 0.1]
      glass: True
    
    - prim_path: "/World/VialBottle"
      usd_path: "assets/chemistry_lab/assets/VialBottle_01.usd"
      position: [0.38, -0.15, 0.76]
      orientation: [0.0, 1.0, 0.0, 0.0]
      scale: [0.45, 0.45, 0.45]
    

    - prim_path: "/World/SamplePlaceBox"
      usd_path: "assets/chemistry_lab/assets/SamplePlaceBox.usd"
      position: [0.1, 0.0, 0.70]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [2.0, 2.0, 2.0]
    

    - prim_path: "/World/tube_rack"
      usd_path: "assets/chemistry_lab/assets/test_tube_rack_3h.usd"
      position: [0.61, -0.2, 0.6]
      orientation: [0.707, 0.0, 0.0, 0.707]
      scale: [1.0, 1.0, 1.0]
    
task:
  max_steps: 3000
  obj_paths:
    - path: "/World/VialBottle"
      position_range:
        x: [0.20, 0.24]
        y: [-0.15, -0.1]
        z: [0.76, 0.76]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1, 0, 1.2]
    resolution: [640, 480]
    focal_length: 10
    # orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    orientation: [0.57922, 0.40558, 0.40558, 0.57923]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    local_translation: [-0.20, 0.0, -0.01]
    local_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    resolution: [640, 480]
    focal_length: 10.0
    horizontal_aperture: 20.955
    focus_distance: 0.50
    clipping_range: [0.05, 10.0]
    image_type: "rgb"

robot:
  type: "franka"
  gripper_position_reference: "rmp"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip
  sample_hz: 10

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
