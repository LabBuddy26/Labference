name: Level4_L11_ConditionModule
task_type: "ConditionModule"
controller_type: "ConditionModule"
mode: "collect"

evaluation:
  policy:
    provider: "gr00t"
    profile: "eai4s_eval/configs/policies/gr00t_franka_ee_pos_v1.yaml"
    host: "127.0.0.1"
    port: 5555
    protocol: "zmq"
    timeout: 30
    execution_horizon: null
    control_hz: 10
  task_spec: "eai4s_eval/configs/tasks/B18_level4_condition_module.yaml"
  model_name: "eai4s_gr00t"
  split: "sim_clean"
  num_episodes: 5
  max_steps: 700
  output_root: "outputs/eval_runs"
  save_video: true

collection_startup:
  ready_joint_positions: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854, 0.04, 0.04]
  warmup_steps: 120
  stable_frames: 30
  joint_velocity_threshold: 0.02
  object_displacement_threshold: 0.0005
  max_wait_steps: 600

max_episodes: 200

condition_module_success:
  pick_lift_height_m: 0.12
  place_xy_tolerance_m: 0.02
  place_z_tolerance_m: 0.05
  # Keep the wrist 2 mm higher than main's original press target to avoid
  # excessive button/device penetration while retaining enough travel to press.
  button_press_target_offset_z_m: 0.002
  button_press_axis: 2
  button_press_displacement_m: 0.003

infer:
  action_space: "ee_pos"
  type: "local"
  obs_names: {"camera_1_rgb": "camera_1_rgb", "camera_3_rgb": "camera_3_rgb"}
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

scene:
  - prim_path: "/World/table"
    usd_path: "assets/chemistry_lab/assets/table.usd"
    position: [0.0, 0.0, 1.25]
    orientation: [1.0, 0.0, 0.0, 0.0]
    scale: [0.001, 0.001, 0.001]
  - prim_path: "/World/heat_device"
    usd_path: "assets/chemistry_lab/assets/heat_device_v1.usd"
    position: [0.21, 0.31, 0.71]
    orientation: [0.707, 0.0, 0.0, -0.707]
    scale: [0.001, 0.001, 0.001]
  - prim_path: "/World/beaker_03"
    usd_path: "assets/chemistry_lab/assets/beaker_2.usd"
    position: [0.16, -0.3, 0.72]
    orientation: [0.707, 0.707, 0.0, 0.0]
    scale: [1.0, 1.0, 1.0]

task:
  max_steps: 4000
  device_path: "/World/heat_device"
  beaker_path: "/World/beaker_03"
  button_path: "/World/heat_device/heat_device/button"
  obj_paths:
    - path: "/World/beaker_03"
      position_range: {x: [0.15, 0.20], y: [-0.30, -0.25], z: [0.72, 0.72]}

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1.0, 0.0, 1.2]
    resolution: [640, 480]
    focal_length: 10
    orientation: [0.57922, 0.40558, 0.40558, 0.57923]
    image_type: "rgb"
  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    local_translation: [-0.20, 0.0, -0.01]
    local_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    resolution: [640, 480]
    focal_length: 10.0
    horizontal_aperture: 20.955
    focus_distance: 0.50
    clipping_range: [0.05, 10.0]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, 0.0, 0.71]

collector: {type: "default", compression: gzip, sample_hz: 10}
hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
