name: Level1_stir

task_type: "stir"
controller_type: "stir"

mode: "collect"  # "collect" or "eval"

evaluation:
  policy:
    provider: "gr00t"
    profile: "eai4s_eval/configs/policies/gr00t_franka_ee_pos_v1.yaml"
    host: "127.0.0.1"
    port: 5555
    protocol: "zmq"
    timeout: 30
    execution_horizon: 16
    control_hz: 10
  task_spec: "eai4s_eval/configs/tasks/B06_level1_stir.yaml"
  model_name: "eai4s_gr00t"
  split: "sim_clean"
  num_episodes: 5
  output_root: "outputs/eval_runs"
  save_video: true

collection_startup:
  # A central, non-singular Franka pose with the gripper open.
  ready_joint_positions: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854, 0.04, 0.04]
  warmup_steps: 120
  stable_frames: 30
  joint_velocity_threshold: 0.02
  object_displacement_threshold: 0.0005
  max_wait_steps: 600

# Official evaluation truth for stirring. The rod must make a continuous
# circular trajectory in this radial/height band and then be lifted out.
stir_success:
  min_radius_m: 0.004
  max_radius_m: 0.035
  min_work_height_m: 0.80
  max_work_height_m: 0.94
  min_samples: 60
  min_angular_sweep_degrees: 300.0
  min_path_length_m: 0.04
  max_sample_jump_m: 0.04
  final_lift_height_m: 0.92

# Keep collection and evaluation on the same demonstrated scene layout.
stir_rack_position: [0.28421, 0.30755, 0.82291]
rod_spawn_offset: [-0.01152, -0.1125, 0.03197]
rod_grasp_height_offset: 0.0
obj_path: "/World/glass_rod"
sub_obj_path: "/World/glass_rod/glass_rod/Cylinder"
target_path: "/World/beaker2"

max_episodes: 200

infer:
  action_space: "ee_pos"
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_3_rgb": 'camera_3_rgb'}
  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""
  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3


scene:
    - prim_path: "/World/table"
      usd_path: "assets/chemistry_lab/assets/table.usd"
      position: [0.0, 0.0, 1.25]
      orientation: [1.0, 0.0, 0.0, 0.0]
      scale: [0.001, 0.001, 0.001]

    - prim_path: "/World/beaker2"
      usd_path: "assets/chemistry_lab/assets/beaker_2.usd"
      position: [0.0, 0.0, 0.72]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      glass: True

    - prim_path: "/World/tube_rack"
      usd_path: "assets/chemistry_lab/assets/test_tube_rack.usd"
      position: [0.3, 0.3, 0.82]
      orientation: [1.0, 0.0, 0.0, 0.0]
      scale: [0.001, 0.001, 0.001]


    - prim_path: "/World/glass_rod"
      usd_path: "assets/chemistry_lab/assets/glass_rod.usd"
      position: [0.3, 0.3, 0.82]
      orientation: [1.0, 0.0, 0.0, 0.0]
      scale: [0.001, 0.001, 0.001]


cameras_names: ["camera_1", "camera_3"]
cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1, 0, 1.2]
    resolution: [640, 480]
    focal_length: 10
    orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    # Wrist-mounted overview of the table, gripper fingers, and grasp target.
    local_translation: [-0.20, 0.0, -0.01]
    local_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    resolution: [640, 480]
    focal_length: 10.0
    horizontal_aperture: 20.955
    focus_distance: 0.50
    clipping_range: [0.05, 10.0]
    image_type: "rgb"
robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip
  sample_hz: 10

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
