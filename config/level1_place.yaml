name: Level1_place

task_type: "place"
controller_type: "place"

mode: "collect"

evaluation:
  policy:
    provider: "gr00t"
    profile: "eai4s_eval/configs/policies/gr00t_franka_ee_pos_v1.yaml"
    host: "127.0.0.1"
    port: 5555
    protocol: "zmq"
    timeout: 30
    execution_horizon: 16
    control_hz: 10
  task_spec: "eai4s_eval/configs/tasks/B02_level1_place.yaml"
  model_name: "eai4s_gr00t"
  split: "sim_clean"
  num_episodes: 5
  max_steps: 800
  output_root: "outputs/eval_runs"
  save_video: true
  execution_horizon: 16

collection_startup:
  # A central, non-singular Franka pose with the gripper open.
  ready_joint_positions: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854, 0.04, 0.04]
  warmup_steps: 120
  stable_frames: 30
  joint_velocity_threshold: 0.02
  object_displacement_threshold: 0.0005
  max_wait_steps: 600
target_path: "/World/target_plat"


max_episodes: 200

infer:
  action_space: "ee_pos"
  type: "local"
  obs_names: {"camera_1_rgb": 'camera_1_rgb', "camera_3_rgb": 'camera_3_rgb'}

  policy_model_path: ""
  policy_config_path: ""
  normalizer_path: ""

  host: "127.0.0.1"
  port: 8000
  n_obs_steps: 1
  timeout: 30
  max_retries: 3

scene:
    - prim_path: "/World/table"
      usd_path: "assets/chemistry_lab/assets/table.usd"
      position: [0.0, 0.0, 1.25]
      orientation: [1.0, 0.0, 0.0, 0.0]
      scale: [0.001, 0.001, 0.001]

    - prim_path: "/World/beaker2"
      usd_path: "assets/chemistry_lab/assets/beaker_2.usd"
      position: [0.0, 0.0, 0.72]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      glass: True

    - prim_path: "/World/target_plat"
      usd_path: "assets/chemistry_lab/assets/target_plat_1.usd"
      # Table top is z=0.707; target_plat is 0.0005 m thick.
      position: [0.0, -0.4, 0.70725]
      orientation: [1.0, 0.0, 0.0, 0.0]
      scale: [0.15, 0.15, 0.0005]
      # Bright orange keeps the place target visually distinct from the table.
      visual_color: [1.0, 0.20, 0.0]

    - prim_path: "/World/conical"
      usd_path: "assets/chemistry_lab/assets/conical_bottle01.usd"
      position: [0.5, -0.2, 0.75]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [0.0001, 0.0001, 0.0001]
      glass: True

    - prim_path: "/World/tube_rack"
      usd_path: "assets/chemistry_lab/assets/test_tube_rack.usd"
      position: [0.5, 0.3, 0.82]
      orientation: [1.0, 0.0, 0.0, 0.0]
      scale: [0.001, 0.001, 0.001]
      glass: True

    - prim_path: "/World/flask"
      usd_path: "assets/chemistry_lab/assets/flask.usd"
      position: [0.42, 0.0, 0.75]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [0.1, 0.1, 0.1]
      glass: True

    - prim_path: "/World/vial"
      usd_path: "assets/chemistry_lab/assets/vial.usd"
      position: [0.4, -0.2, 0.75]
      orientation: [0.707, 0.707, 0.0, 0.0]
      scale: [0.1, 0.1, 0.1]
      glass: True

    - prim_path: "/World/scale"
      usd_path: "assets/chemistry_lab/assets/Scale.usd"
      position: [0.5, -0.4, 0.7]
      orientation: [0.707, 0.0, 0.0, 0.707]
      scale: [1.0, 1.0, 1.0]

    - prim_path: "/World/cabinet"
      usd_path: "assets/chemistry_lab/assets/Cabinet_01.usd"
      position: [0.3, 1.0, 1.02]
      orientation: [0.707, 0.0, 0.0, -0.707]
      scale: [0.8, 0.8, 0.8]

    - prim_path: "/World/DryingBox"
      usd_path: "assets/chemistry_lab/assets/DryingBox_01.usd"
      position: [0.4, -1.0, 0.7]
      orientation: [0.0, 0.0, 0.0, -1.0]
      scale: [0.001, 0.001, 0.001]

task:
  max_steps: 2000
  obj_paths:
    - path: "/World/beaker2"
      position_range:
        x: [0.19, 0.34]
        y: [0.10, 0.25]
        z: [0.8, 0.8]

    - path: "/World/target_plat"
      position_range:
        x: [0.18, 0.33]
        y: [-0.32, -0.17]
        # DualObjectTask applies this range on every reset.
        z: [0.70725, 0.70725]

cameras:
  - prim_path: "/World/Camera1"
    name: "camera_1"
    translation: [1, 0, 1.2]
    resolution: [640, 480]
    focal_length: 10
    # orientation: [0.61237, 0.35355, 0.35355, 0.61237]
    orientation: [0.57922, 0.40558, 0.40558, 0.57923]
    image_type: "rgb"

  # - prim_path: "/World/Camera2"
  #   name: "camera_2"
  #   translation: [0.1, 0, 1.4]
  #   resolution: [640, 480]
  #   focal_length: 10
  #   orientation: [0.70711, 0, 0, -0.70711]
  #   image_type: "rgb"

  - prim_path: "/World/Franka/panda_hand/arm_camera"
    name: "camera_3"
    # Wrist-mounted overview of the table, gripper fingers, and grasp target.
    local_translation: [-0.20, 0.0, -0.01]
    local_orientation: [0.20083, 0.67799, -0.67799, -0.20083]
    resolution: [640, 480]
    focal_length: 10.0
    horizontal_aperture: 20.955
    focus_distance: 0.50
    clipping_range: [0.05, 10.0]
    image_type: "rgb"

robot:
  type: "franka"
  position: [-0.4, -0, 0.71]

collector:
  type: "default"
  compression: gzip
  sample_hz: 10

hydra:
  run:
    dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}

multi_run:
  run_dir: outputs/${mode}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
